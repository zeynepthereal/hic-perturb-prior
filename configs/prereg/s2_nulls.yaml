# PRE-REGISTERED (S2 nulls: permutation x10, rewire x5, random x10). DO NOT RUN before the pre-registration is frozen.
name: prereg_s2_nulls
data:
  source: gears
  raw_path: data/gears/replogle_k562_essential/perturb_processed.h5ad
  processed_path: data/processed/k562_gears.npz
  qc_path: results/qc_perturbations_gears.csv
  pert_col: condition
  control_label: ctrl
eval:
  seeds: []
  split_fracs:
  - 0.7
  - 0.1
  - 0.2
  split_files:
    gears_seed1: configs/splits/gears_k562_seed1.json
    gears_seed2: configs/splits/gears_k562_seed2.json
    gears_seed3: configs/splits/gears_k562_seed3.json
    gears_seed4: configs/splits/gears_k562_seed4.json
    gears_seed5: configs/splits/gears_k562_seed5.json
  embeddings:
  - b500_hic_trans
  - b500_hic_trans:perm:0
  - b500_hic_trans:perm:1
  - b500_hic_trans:perm:2
  - b500_hic_trans:perm:3
  - b500_hic_trans:perm:4
  - b500_hic_trans:perm:5
  - b500_hic_trans:perm:6
  - b500_hic_trans:perm:7
  - b500_hic_trans:perm:8
  - b500_hic_trans:perm:9
  - b500_hic_trans:rewire:0
  - b500_hic_trans:rewire:1
  - b500_hic_trans:rewire:2
  - b500_hic_trans:rewire:3
  - b500_hic_trans:rewire:4
  - b500_hic_trans:random:0
  - b500_hic_trans:random:1
  - b500_hic_trans:random:2
  - b500_hic_trans:random:3
  - b500_hic_trans:random:4
  - b500_hic_trans:random:5
  - b500_hic_trans:random:6
  - b500_hic_trans:random:7
  - b500_hic_trans:random:8
  - b500_hic_trans:random:9
  refit_trainval: false
  paper_K: 10
  paper_lambda: 0.1
  K_grid:
  - 10
  - 20
  - 50
  lambda_grid:
  - 0.1
  extra_fixed_hp:
  - - 20
    - 0.1
  - - 50
    - 0.1
  n_top_de: 20
  n_top_expr: 1000
  exclude_target_primary: true
